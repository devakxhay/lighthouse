{{define "create_modal"}}
<div class="modal-backdrop" x-show="showCreate" x-transition @click.self="showCreate=false">
  <div class="modal" @click.stop>
    <div class="modal-header">
      <h2>Register New App</h2>
      <button class="btn btn-sm" @click="showCreate=false">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">App Name *</label>
          <input class="form-input" x-model="form.name" placeholder="et-backend" />
          <p class="form-hint">Lowercase, no spaces. Used as service name.</p>
        </div>
        <div class="form-group">
          <label class="form-label" x-text="form.type === 'service' ? 'Domain' : 'Domain *'"></label>
          <input class="form-input" x-model="form.domain" :placeholder="form.type === 'service' ? 'e.g. et-backend.internal (optional)' : 'et-backend.internal'" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">App Type *</label>
          <select class="form-select" x-model="form.type">
            <option value="">Select type</option>
            <option value="spring-boot">Spring Boot</option>
            <option value="nextjs">Next.js</option>
            <option value="go">Go</option>
            <option value="marp">Marp (HTML Decks)</option>
            <option value="vite">Vite App</option>
            <option value="service">Existing Service</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" x-text="form.type === 'service' ? 'Port *' : 'Port'"></label>
          <input class="form-input" x-model.number="form.port" :placeholder="form.type === 'service' ? 'e.g. 8080' : 'Auto (30000-45000)'" type="number" />
        </div>
      </div>
      <div class="form-group" x-show="form.type !== 'service'">
        <label class="form-label">Git URL *</label>
        <input class="form-input" x-model="form.git_url" placeholder="https://github.com/user/repo.git" />
        <p class="form-hint">Git repository URL to clone and build from.</p>
      </div>
      <div class="form-group" x-show="form.type !== 'service'">
        <label class="form-label">App Directory</label>
        <input class="form-input" x-model="form.app_dir" placeholder="/home/pi/apps/et-backend (optional)" />
        <p class="form-hint">Working directory for the process (auto-generated if left blank).</p>
      </div>
      <div class="form-group" x-show="form.type !== 'service'">
        <label class="form-label">Custom Start Command</label>
        <input class="form-input" x-model="form.start_command" placeholder="e.g. npm run dev (optional)" />
        <p class="form-hint">Custom command to start the app (overrides default ExecStart).</p>
      </div>
      <div class="form-group" x-show="form.type === 'go' || form.type === 'marp'">
        <label class="form-label" x-text="form.type === 'go' ? 'Go Entry Point' : 'Marp Markdown File'"></label>
        <input class="form-input" x-model="form.entry_point" :placeholder="form.type === 'go' ? 'main.go (optional)' : 'index.md (optional)'" />
        <p class="form-hint" x-text="form.type === 'go' ? 'Relative path to the main Go file (defaults to main.go).' : 'Relative path to the slide markdown file (defaults to index.md or first markdown file found).'"></p>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" @click="showCreate=false">Cancel</button>
      <button class="btn btn-primary" @click="createApp()" :disabled="creating">
        <span x-show="creating" class="spinner"></span>
        <span x-text="creating ? 'Registering...' : 'Register App'"></span>
      </button>
    </div>
  </div>
</div>
{{end}}
