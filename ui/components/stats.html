{{define "stats"}}
<div class="stats-grid" x-show="!selectedApp && apps.length > 0">
  <div class="stats-card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span class="stats-label">Total Applications</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="2" style="opacity:0.8">
        <rect x="2" y="3" width="20" height="14" rx="2" />
        <line x1="8" y1="21" x2="16" y2="21" />
        <line x1="12" y1="17" x2="12" y2="21" />
      </svg>
    </div>
    <div class="stats-value" x-text="apps.length">0</div>
  </div>

  <div class="stats-card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span class="stats-label">Active / Running</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2" style="opacity:0.8">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
        <polyline points="22 4 12 14.01 9 11.01" />
      </svg>
    </div>
    <div class="stats-value" style="color: var(--green)" x-text="apps.filter(a => (a.live_status || a.status) === 'running').length">0</div>
  </div>

  <div class="stats-card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span class="stats-label">Stopped</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" style="opacity:0.8">
        <circle cx="12" cy="12" r="10" />
        <rect x="9" y="9" width="6" height="6" />
      </svg>
    </div>
    <div class="stats-value" style="color: var(--muted)" x-text="apps.filter(a => (a.live_status || a.status) === 'stopped').length">0</div>
  </div>

  <div class="stats-card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span class="stats-label">Issues / Failed</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2" style="opacity:0.8">
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="8" x2="12" y2="12" />
        <line x1="12" y1="16" x2="12.01" y2="16" />
      </svg>
    </div>
    <div class="stats-value" style="color: var(--red)" x-text="apps.filter(a => (a.live_status || a.status) === 'failed').length">0</div>
  </div>
</div>
{{end}}
